server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resuelve el ruteo de React Router:
    # cualquier ruta que no sea un archivo o directorio real
    # cae a index.html para que el router del cliente lo maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash de contenido (Vite los versiona automáticamente)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Seguridad mínima
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
